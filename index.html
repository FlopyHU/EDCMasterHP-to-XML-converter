<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDC to XDF Converter</title>
    <style>
        body { background-color: #2c2f33; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #23272a; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        textarea { width: 100%; height: 200px; background: #1c1c1c; color: #43b581; border: 1px solid #444; border-radius: 4px; padding: 10px; font-family: monospace; resize: vertical; box-sizing: border-box; }
        button { background-color: #7289da; color: white; border: none; padding: 12px 20px; margin-top: 15px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        button:hover { background-color: #5b6eae; }
        #log { margin-top: 15px; padding: 10px; background: #1c1c1c; border-left: 4px solid #f04747; min-height: 50px; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>EDCMasterHP HTML to XDF Converter</h2>
        <p>Paste the raw HTML source containing the map list table below:</p>
        <textarea id="htmlInput" placeholder="Paste HTML here..."></textarea>
        <button onclick="convertHTML()">Generate & Download XDF</button>
        <div id="log">Status: Awaiting input...</div>
    </div>

    <script>
        function convertHTML() {
            const html = document.getElementById('htmlInput').value;
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = "Processing...\n";
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const rows = doc.querySelectorAll('tr[id^="mltr_"]');
            
            if (rows.length === 0) {
                logDiv.innerHTML += "<span style='color:#f04747;'>Error: No maps found. Ensure you pasted the full HTML containing the 'mltr_' table rows.</span>\n";
                return;
            }

            let xdf = `<?xml version="1.0"?>\n<XDFFHEADER version="1.0">\n  <XDFCATEGORIES>\n    <CATEGORY index="0" name="EDC Imported"/>\n  </XDFCATEGORIES>\n  <XDFTABLES>\n`;
            let successCount = 0;
            let errorCount = 0;

            rows.forEach((row, idx) => {
                try {
                    const cols = row.querySelectorAll('td');
                    if (cols.length < 4) throw new Error("Missing columns");
                    
                    const hexAddr = cols[1].innerText.trim();
                    const dims = cols[2].innerText.trim().split('x');
                    const mapName = cols[3].innerText.trim();
                    
                    const xSize = parseInt(dims[0].trim()) || 1;
                    const ySize = dims.length > 1 ? parseInt(dims[1].trim()) : 1;

                    xdf += `    <XDFTABLE uniqueid="${1000 + idx}" category="0">\n`;
                    xdf += `      <TITLE>${hexAddr} - ${mapName} (${xSize}x${ySize})</TITLE>\n`;
                    xdf += `      <ADDRESS offset="0x${hexAddr}" units="" decimalplaces="2"/>\n`;
                    xdf += `      <ZAXIS id="1" boardid="0" title="Z Axis">\n`;
                    xdf += `        <EMBEDDEDDATA mmedaddress="0x${hexAddr}" mmedelementsizebits="16" mmedrowstride="${xSize * 2}" mmedcolstride="2" mmedtypeflags="0x10000"/>\n`;
                    xdf += `      </ZAXIS>\n`;
                    xdf += `      <AXIS id="x" Index="0" label="X Axis">\n`;
                    xdf += `        <EMBEDDEDDATA mmedelementsizebits="16" mmedrowstride="0" mmedcolstride="2" mmedtypeflags="0x10000"/>\n`;
                    xdf += `      </AXIS>\n`;
                    if (ySize > 1) {
                        xdf += `      <AXIS id="y" Index="1" label="Y Axis">\n`;
                        xdf += `        <EMBEDDEDDATA mmedelementsizebits="16" mmedrowstride="2" mmedcolstride="0" mmedtypeflags="0x10000"/>\n`;
                        xdf += `      </AXIS>\n`;
                    }
                    xdf += `    </XDFTABLE>\n`;
                    successCount++;
                } catch (e) {
                    errorCount++;
                    logDiv.innerHTML += `<span style='color:#faa61a;'>Warning: Failed to parse row ${idx + 1} (${e.message})</span>\n`;
                }
            });

            xdf += `  </XDFTABLES>\n</XDFFHEADER>`;
            logDiv.innerHTML += `<span style='color:#43b581;'>Success: Converted ${successCount} maps. Errors: ${errorCount}. Downloading XDF...</span>`;

            const blob = new Blob([xdf], { type: "text/xml" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "EDCMaster_Export.xdf";
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
